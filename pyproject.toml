[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeflow"
dynamic = ["version"]
description = "Spec Kit development workflow, project verification and authorized finalization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ForgeFlow Team" }]
dependencies = []

[project.scripts]
forgeflow = "forgeflow.cli:main"
harness = "forgeflow.cli:harness_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "forgeflow._version.__version__"}

[tool.setuptools.package-data]
"forgeflow" = ["CHANGELOG.md", "spec/*.md", "spec/VERSION", "adr/*.md", "templates/*.md", "templates/adr/*.md", "templates/speckit/scripts/bash/*", "templates/speckit/templates/*"]

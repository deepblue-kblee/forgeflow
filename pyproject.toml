[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeflow"
dynamic = ["version"]
description = "Autonomous Agent Governance Framework & Harness Gate CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ForgeFlow Team" }]
dependencies = []

[project.scripts]
forgeflow = "forgeflow.cli:main"
harness = "forgeflow.cli:harness_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "forgeflow._version.__version__"}

[tool.setuptools.package-data]
"forgeflow.templates" = ["*.md", "spec/*.md"]
"forgeflow.catalog_oracles" = ["*.json"]
